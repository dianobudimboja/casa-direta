<!-- templates/errors/404.html -->
{% extends "base.html" %}

{% block title %}Página não encontrada - Casa Direta{% endblock %}

{% block content %}
<div class="error-container">
    <div class="error-content">
        <div class="error-code">404</div>
        <h1>Página não encontrada</h1>
        <p>A página que você procura não existe ou foi Removida.</p><br>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
            <i class="fas fa-home"></i> Voltar para o início
        </a>
    </div>
</div>
<style>
    .error-container {
        min-height: 60vh;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .error-code {
        font-size: 5rem;
        font-weight: 700;
        color: var(--primary);
    }
</style>
{% endblock %}
