# render.yaml
services:
  - type: web
    name: casa-direta
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: casa-direta-db
          property: connectionString
      - key: SECRET_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: BASE_URL
        value: https://casa-direta.onrender.com
      - key: MAIL_SERVER
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USE_TLS
        value: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

databases:
  - name: casa-direta-db
    database: casadireta
    user: casadireta
    plan: free